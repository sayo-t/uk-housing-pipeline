name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: housing
          POSTGRES_PASSWORD: housing
          POSTGRES_DB: housing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: housing
      POSTGRES_DB: housing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install ruff dbt-postgres "psycopg[binary]" python-dotenv

      - name: Lint Python
        run: ruff check ingest airflow/dags

      - name: Load fixture data
        run: PGPASSWORD=housing psql -h localhost -U housing -d housing -f ci/seed_raw.sql

      - name: dbt run
        run: cd dbt && dbt run --profiles-dir .

      - name: dbt test
        run: cd dbt && dbt test --profiles-dir .
